[project]
name = "vibepy-core"
version = "0.0.0"
description = "Agent-native application framework exposing Tools through Web and Agent channels"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "nicegui>=3.16",
    "uvicorn>=0.34",
]
agent = [
    "mcp>=2.1",
]

[tool.uv.workspace]
members = ["packages/*", "examples/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibepy_core"]

[dependency-groups]
dev = [
    "vibepy-core[web,agent]",
    "vibepy-hub",
    "vibepy-todo",
    "vibepy-notes",
    "nicegui[testing]>=3.16",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.6.2",
]

[tool.uv.sources]
vibepy-hub = { workspace = true }
vibepy-todo = { workspace = true }
vibepy-notes = { workspace = true }

[tool.ruff]
line-length = 100
# ruff formats the Python blocks in Markdown as well, and a block in
# `docs/architecture/` is an excerpt of a contract written to be read rather
# than code to be styled. Scope belongs here rather than in each runner's file
# list: the hook runs `ruff format --force-exclude`, so this wins over the
# files pre-commit passes it.
extend-exclude = ["docs"]
src = [
    "src",
    "tests",
    "packages/vibepy-hub/src",
    "packages/vibepy-hub/tests",
    "examples/todo/src",
    "examples/notes/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = [
    "src",
    "tests",
    "packages/vibepy-hub/src",
    "packages/vibepy-hub/tests",
    "examples/todo/src",
    "examples/notes/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vibepy-hub/tests"]
asyncio_mode = "auto"
# NiceGUI's user fixture runs a main file unless this is empty. Pages are
# registered by the tests themselves, so there is no main file to run.
main_file = ""
