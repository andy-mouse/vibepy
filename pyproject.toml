[project]
name = "vibepy-core"
version = "0.0.0"
description = "Agent-native application framework exposing Tools through Web and Agent channels"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "nicegui>=3.16",
    "uvicorn>=0.34",
]
agent = [
    "mcp>=2.1",
]

[tool.uv.workspace]
members = ["packages/*", "fixtures/*"]
# `fixtures/*` are distributions a test installs, not product surface. They are
# members so that they resolve the core the way every other distribution here
# does. Two of them are in `[dependency-groups].dev` because the framework's
# own tests import one of them directly; the rest are absent, so nothing
# installs them into this repository's own environment.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibepy_core"]

[dependency-groups]
dev = [
    "vibepy-core[web,agent]",
    "vibepy-studio",
    "vibepy-todo",
    "vibepy-notes",
    "vibepy-timer",
    "vibepy-expense",
    "nicegui>=3.16",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.6.2",
    "selenium>=4.30",
]

[tool.uv.sources]
vibepy-studio = { workspace = true }
vibepy-todo = { workspace = true }
vibepy-notes = { workspace = true }
vibepy-timer = { workspace = true }
vibepy-expense = { workspace = true }

[tool.ruff]
line-length = 100
# ruff formats the Python blocks in Markdown as well, and a block in
# `docs/architecture/` is an excerpt of a contract written to be read rather
# than code to be styled. Scope belongs here rather than in each runner's file
# list: the hook runs `ruff format --force-exclude`, so this wins over the
# files pre-commit passes it. The pattern is relative to the project root, so
# it names this `docs` and not a `docs` a member might carry.
extend-exclude = ["docs/**"]
# Where a first-party import resolves from, which is not the same list as what
# ruff checks: the scope is the whole tree less what `extend-exclude` names.
# Globs are supported, so a member added later needs no edit here.
src = ["src", "tests", "packages/*/src", "packages/*/tests", "fixtures/*/src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "TID", "D"]

# PEP 257 is a standard, so it is enforced by the linter rather than restated as
# a rule of our own. ruff implements it as the `D` rules and `convention`
# selects which of them a style disables.
# <https://docs.astral.sh/ruff/settings/#lint_pydocstyle_convention>
[tool.ruff.lint.pydocstyle]
convention = "pep257"

# The two headline invariants, enforced by the linter rather than by a test of
# our own: no MCP type reaches the core Tool model and no Web type reaches the
# core Page model. A channel's own adapter and the command that opens the Web
# channel and the command that opens the Agent channel are exempt below,
# because being a channel component is their job.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mcp".msg = "The core declares no channel. Only vibepy_core.adapters.mcp and vibepy_core.mcp may import the MCP SDK."
"nicegui".msg = "The core declares no channel. Only vibepy_core.adapters.nicegui and vibepy_core.serve may import NiceGUI."

[tool.ruff.lint.per-file-ignores]
# The ban applies to the framework core and nowhere else: an App, an example
# and a test are all entitled to a channel SDK.
"!src/vibepy_core/**" = ["TID251"]
"src/vibepy_core/adapters/**" = ["TID251"]
"src/vibepy_core/serve.py" = ["TID251"]
"src/vibepy_core/mcp.py" = ["TID251"]
# Docstrings are documentation of a public surface. A test module and a fixture
# App are neither: their module docstrings state what the file covers, and
# PEP 8 asks for docstrings on public API, which these are not.
"tests/**" = ["D"]
"packages/*/tests/**" = ["D"]
"fixtures/**" = ["D"]

[tool.pyright]
include = ["src", "tests", "packages", "fixtures", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
# The layout pytest recommends for a new src-layout project: no sys.path
# rewriting on import, and no __init__.py in a tests directory, so two
# distributions may each hold one without their packages colliding.
# <https://docs.pytest.org/en/stable/explanation/goodpractices.html>
# `--durations` is not a diagnostic left switched on by accident. This suite
# starts real child processes and builds real environments, so its cost is a
# property worth seeing at the moment it changes rather than after a gate has
# grown slow -- and it is the only way to see which tests cost what on a
# platform none of us runs, which is how the Windows runner came to take four
# times the macOS one without anyone able to say where.
addopts = [
    "--import-mode=importlib",
    "--durations=15",
    # Registered here, once, because two test trees (root and vibepy-studio) need
    # NiceGUI's User fixture and pytest allows `pytest_plugins` only at the
    # top-level conftest, not in a package's own.
    "-p",
    "nicegui.testing.user_plugin",
    # The screen plugin beside it: NiceGUI documents the two fixtures as a pair,
    # and its `--driver Chrome` belongs to `pytest-selenium`, which is not here
    # -- the plugin builds its own headless Chrome and reads no such option.
    "-p",
    "nicegui.testing.screen_plugin",
]
# What a test module reaches its own directory's helpers through, stated here
# rather than left to the import mode's side effects.
pythonpath = ["tests", "packages/vibepy-studio/tests"]
# `integration` names the tests whose subject crosses into a real distribution
# or a real child process -- the ones that build an environment or start an
# App. It selects and never excuses: `make test` runs everything. Strict, so a
# mistyped marker fails rather than marking nothing.
# <https://docs.pytest.org/en/stable/example/markers.html>
markers = [
    "integration: crosses into a real distribution or child process",
    "apps(*names): the fixture Apps a test's copy of the template root holds",
    "browser: drives a real browser through NiceGUI's screen fixture",
]
strict_markers = true
asyncio_mode = "auto"
# NiceGUI's user fixture runs a main file unless this is empty. Pages are
# registered by the tests themselves, so there is no main file to run.
main_file = ""
