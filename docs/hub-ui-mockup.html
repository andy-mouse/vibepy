  <script>
    (() => {
      const root = document.getElementById('vibepy-hub-mockup');
      if (!root) return;

      // What `python -m vibepy_core.describe` reports for each App in its own
      // environment: identity plus the configuration schema it declares.
      const sourceApps = [
        {
          id: 'customer-desk',
          name: 'Customer Desk',
          version: '1.4.0',
          config: [
            { name: 'api_base_url', type: 'string', required: true },
            { name: 'api_token', type: 'secret', required: true }
          ]
        },
        {
          id: 'expense-review',
          name: 'Expense Review',
          version: '1.0.0',
          config: [
            { name: 'ledger_path', type: 'path', required: true },
            { name: 'approval_limit', type: 'integer', required: false }
          ]
        },
        {
          id: 'vibepy-todo',
          name: 'Todo',
          version: '2.1.1',
          config: [
            { name: 'db_path', type: 'path', required: true },
            { name: 'db_key', type: 'secret', required: true }
          ]
        }
      ];

      const installations = new Map([
        ['customer-desk', {
          id: 'customer-desk',
          name: 'Customer Desk',
          version: '1.4.0',
          state: 'running',
          values: { api_base_url: 'https://desk.internal' },
          secretsSet: ['api_token']
        }],
        ['expense-review', {
          id: 'expense-review',
          name: 'Expense Review',
          version: '0.9.2',
          state: 'installed',
          values: {}
        }],
        // An App whose declaration the Hub could not read. It is installed, so
        // it is listed; it cannot be described, so it cannot be configured.
        ['field-notes', {
          id: 'field-notes',
          name: 'Field Notes',
          version: '0.3.0',
          state: 'installed',
          values: {},
          diagnostic: {
            code: 'package.entrypoint_unloadable',
            message: "Entrypoint 'field_notes.entry:APP' declared by App 'field-notes' did not load"
          }
        }]
      ]);

      const list = root.querySelector('[data-app-list]');
      const boardHead = root.querySelector('[data-board-head]');
      const summary = root.querySelector('[data-summary]');
      const sourceValue = root.querySelector('[data-source-value]');
      const registerFolderButton = root.querySelector('[data-register-folder]');
      const unregisterFolderButton = root.querySelector('[data-unregister-folder]');
      const toast = root.querySelector('[data-toast]');
      const appNameCollator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });
      const stateOrder = { running: 0, installed: 1, available: 2 };
      const typeLabels = { string: 'string', path: 'path', integer: 'integer', secret: 'secret' };
      let sourceName = '~/VibePy Packages';
      let openConfigFor = null;
      let configErrors = new Map();
      let toastTimer;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
      }

      function escape(value) {
        return String(value).replace(/[&<>"]/g, character =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[character]);
      }

      function button(label, action, style = 'hub-secondary', disabled = false) {
        return `<button class="${style}" type="button" data-action="${action}"${disabled ? ' disabled' : ''}>${label}</button>`;
      }

      function declaredConfig(appId) {
        const release = sourceApps.find(candidate => candidate.id === appId);
        return release ? release.config : [];
      }

      // An App is configured once every field it declared as required has a
      // value. An App that declares nothing is configured the moment it is
      // installed.
      function isConfigured(app) {
        if (app.diagnostic) return false;
        return declaredConfig(app.id)
          .filter(field => field.required)
          .every(field => Boolean(app.values && app.values[field.name]));
      }

      function needsConfiguration(app) {
        return app.state === 'installed' && !app.diagnostic && !isConfigured(app);
      }

      function stageIndex(app) {
        if (app.state === 'available') return 0;
        if (app.state === 'running') return 3;
        return isConfigured(app) ? 2 : 1;
      }

      function renderRail(app) {
        const stageLabels = ['Available', 'Installed', 'Configured', 'Running'];
        const currentIndex = stageIndex(app);
        const requiresConfiguration = needsConfiguration(app);
        const updateAvailable = Boolean(app.availableVersion);
        return `<div class="hub-rail" aria-label="${stageLabels[currentIndex]} stage${requiresConfiguration ? '; configuration required' : ''}${updateAvailable ? `; update to version ${escape(app.availableVersion)} available` : ''}">${stageLabels.map((label, index) => {
          const done = index <= currentIndex;
          const live = index === 3 && app.state === 'running';
          const required = index === 2 && requiresConfiguration;
          const update = index === 1 && updateAvailable;
          return `<div class="hub-stage ${done ? 'is-done' : ''} ${live ? 'is-running' : ''} ${required ? 'is-required' : ''} ${update ? 'is-update' : ''}">
            <span class="hub-stage-node" aria-hidden="true">${required ? '!' : update ? '↑' : '✓'}</span><span>${label}</span>
          </div>`;
        }).join('')}</div>`;
      }

      function renderActions(app) {
        if (app.state === 'available') return button('Install', 'install', 'hub-primary');
        if (app.state === 'running') return button('Stop', 'stop', 'hub-secondary');
        if (app.diagnostic) return button('Uninstall', 'uninstall', 'hub-danger');

        const parts = [button('Uninstall', 'uninstall', 'hub-danger')];
        const configured = isConfigured(app);
        const hasFields = declaredConfig(app.id).length > 0;
        if (hasFields) {
          parts.push(button('Configure', 'configure', configured ? 'hub-secondary' : 'hub-primary'));
        }
        if (app.availableVersion) {
          parts.push(button('Update', 'update', configured ? 'hub-primary' : 'hub-secondary'));
        } else {
          // A window validates configuration before it acquires anything, so
          // starting an unconfigured App would only fail. Say so up front.
          parts.push(button('Start', 'start', configured ? 'hub-primary' : 'hub-secondary', !configured));
        }
        return parts.join('');
      }

      function renderConfig(app) {
        const fields = declaredConfig(app.id);
        if (openConfigFor !== app.id || !fields.length) return '';
        const invalid = configErrors.get(app.id) || [];
        const rows = fields.map(field => {
          const stored = (app.values && app.values[field.name]) || '';
          const isSecret = field.type === 'secret';
          const value = isSecret ? '' : stored;
          const placeholder = isSecret && (app.secretsSet || []).includes(field.name)
            ? '•••••••• (set)'
            : '';
          return `<div class="hub-field ${invalid.includes(field.name) ? 'is-invalid' : ''}">
            <label for="field-${app.id}-${field.name}">
              <span class="hub-field-name">${escape(field.name)}</span>
              <span class="hub-field-type">${typeLabels[field.type]}${field.required ? ' · required' : ' · optional'}</span>
            </label>
            <input id="field-${app.id}-${field.name}" type="${isSecret ? 'password' : 'text'}"
              data-field="${escape(field.name)}" value="${escape(value)}"
              placeholder="${placeholder}" autocomplete="off">
          </div>`;
        }).join('');
        return `<div class="hub-config" data-config-for="${app.id}">
          <p class="hub-config-head">What ${escape(app.name)} requires</p>
          <p class="hub-config-note">Declared by the App itself. A secret is write-only: it is stored and never shown back.</p>
          ${rows}
          <div class="hub-config-error" ${invalid.length ? '' : 'hidden'}>
            <span class="hub-code">config.invalid</span>
            <span>Missing required ${invalid.length === 1 ? 'field' : 'fields'}: ${invalid.map(escape).join(', ')}</span>
          </div>
          <div class="hub-config-actions">
            ${button('Cancel', 'config-cancel', 'hub-quiet')}
            ${button('Save', 'config-save', 'hub-primary')}
          </div>
        </div>`;
      }

      function renderDiagnostic(app) {
        if (!app.diagnostic) return '';
        return `<div class="hub-diagnostic">
          <span class="hub-code">${escape(app.diagnostic.code)}</span>
          <span>${escape(app.diagnostic.message)}</span>
        </div>`;
      }

      function visibleApps() {
        const appsById = new Map();
        if (sourceName) {
          sourceApps.forEach(release => appsById.set(release.id, { ...release, state: 'available' }));
        }
        installations.forEach(installation => {
          const release = sourceName && sourceApps.find(candidate => candidate.id === installation.id);
          appsById.set(installation.id, {
            ...installation,
            availableVersion: release && release.version !== installation.version ? release.version : null
          });
        });
        return [...appsById.values()];
      }

      function renderEmpty() {
        const message = sourceName
          ? ['No apps found', 'This package folder does not contain any compatible VibePy Apps.']
          : ['No package folder selected', 'Choose a package folder above to see available apps.'];
        return `<div class="hub-empty"><div><h2>${message[0]}</h2><p>${message[1]}</p></div></div>`;
      }

      function render() {
        const available = sourceName ? sourceApps.length : 0;
        const installed = installations.size;
        const running = [...installations.values()].filter(app => app.state === 'running').length;
        const apps = visibleApps();
        const sortedApps = apps.sort((left, right) => {
          const stateDifference = stateOrder[left.state] - stateOrder[right.state];
          return stateDifference || appNameCollator.compare(left.name, right.name);
        });
        summary.innerHTML = [
          [available, 'Available'],
          [installed, 'Installed'],
          [running, 'Running']
        ].map(([value, label]) => `<div class="hub-summary-item"><span class="hub-summary-value">${value}</span><span class="hub-summary-label">${label}</span></div>`).join('');

        sourceValue.textContent = sourceName || 'No folder registered';
        unregisterFolderButton.hidden = !sourceName;
        registerFolderButton.hidden = Boolean(sourceName);
        boardHead.hidden = sortedApps.length === 0;

        list.innerHTML = sortedApps.length ? sortedApps.map(app => `<article class="hub-app-row" data-app-id="${app.id}">
          <div>
            <h2 class="hub-app-name">${escape(app.name)}</h2>
            <div class="hub-app-meta">
              <span>v${escape(app.version)}</span>
            </div>
          </div>
          ${renderRail(app)}
          <div class="hub-actions">
            ${renderActions(app)}
          </div>
          ${renderDiagnostic(app)}
          ${renderConfig(app)}
        </article>`).join('') : renderEmpty();
      }

      registerFolderButton.addEventListener('click', async () => {
        let selectedFolder;
        if (globalThis.showDirectoryPicker) {
          try {
            const directory = await globalThis.showDirectoryPicker({ mode: 'read' });
            selectedFolder = `~/${directory.name}`;
          } catch (error) {
            if (error?.name !== 'AbortError') showToast('The package folder could not be opened.');
            return;
          }
        } else {
          selectedFolder = sourceName === '~/VibePy Packages'
            ? '~/Downloads/VibePy Packages'
            : '~/VibePy Packages';
        }
        sourceName = selectedFolder;
        render();
        showToast(`${sourceApps.length} apps available from ${sourceName}.`);
      });

      unregisterFolderButton.addEventListener('click', () => {
        if (!confirm('Unregister this package folder? The folder, installed apps, and app data will not be deleted.')) return;
        sourceName = null;
        openConfigFor = null;
        render();
        showToast('Package folder unregistered. Installed apps are unchanged.');
      });

      function saveConfig(app) {
        const panel = list.querySelector(`[data-config-for="${app.id}"]`);
        const held = app.secretsSet || [];
        const entered = {};
        // A secret's value is not in `values` and is not sent back: an empty
        // secret field means "keep what is held", which is what the Hub reads
        // an omitted field as. Anything else would let the screen overwrite a
        // stored secret with a blank.
        panel.querySelectorAll('[data-field]').forEach(input => {
          const name = input.dataset.field;
          const typed = input.value.trim();
          const isSecret = declaredConfig(app.id).some(
            field => field.name === name && field.type === 'secret'
          );
          if (isSecret) {
            if (typed) entered[name] = typed;
            return;
          }
          entered[name] = typed || (app.values && app.values[name]) || '';
        });
        // The same rule the framework applies before it opens a window: every
        // required field the App declared must have a value, and every failing
        // field is named at once. A held secret has one already.
        const missing = declaredConfig(app.id)
          .filter(field => field.required && !entered[field.name] && !held.includes(field.name))
          .map(field => field.name);
        if (missing.length) {
          configErrors.set(app.id, missing);
          render();
          return;
        }
        app.secretsSet = declaredConfig(app.id)
          .filter(field => field.type === 'secret')
          .map(field => field.name)
          .filter(name => entered[name] || held.includes(name));
        declaredConfig(app.id)
          .filter(field => field.type === 'secret')
          .forEach(field => delete entered[field.name]);
        app.values = entered;
        configErrors.delete(app.id);
        openConfigFor = null;
        render();
        showToast(`${app.name} configured.`);
      }

      list.addEventListener('click', event => {
        const actionButton = event.target.closest('[data-action]');
        if (!actionButton) return;
        const row = actionButton.closest('[data-app-id]');
        const appId = row.dataset.appId;
        const app = installations.get(appId) || sourceApps.find(item => item.id === appId);
        const action = actionButton.dataset.action;
        if (action === 'install') {
          installations.set(appId, { id: app.id, name: app.name, version: app.version, state: 'installed', values: {} });
          const required = declaredConfig(appId).filter(field => field.required).length;
          openConfigFor = required ? appId : null;
          showToast(required
            ? `${app.name} installed. It requires ${required} ${required === 1 ? 'value' : 'values'}.`
            : `${app.name} installed.`);
        }
        if (action === 'configure') {
          openConfigFor = openConfigFor === appId ? null : appId;
          configErrors.delete(appId);
        }
        if (action === 'config-cancel') {
          openConfigFor = null;
          configErrors.delete(appId);
        }
        if (action === 'config-save') {
          saveConfig(installations.get(appId));
          return;
        }
        if (action === 'start') { installations.get(appId).state = 'running'; showToast(`${app.name} is running.`); }
        if (action === 'stop') { installations.get(appId).state = 'installed'; showToast(`${app.name} stopped safely.`); }
        if (action === 'update') {
          const installation = installations.get(appId);
          installation.version = sourceApps.find(item => item.id === appId).version;
          showToast(`${app.name} updated to v${installation.version}.`);
        }
        if (action === 'uninstall' && confirm(`Uninstall ${app.name}? App data will be retained.`)) {
          installations.delete(appId);
          if (openConfigFor === appId) openConfigFor = null;
          showToast(`${app.name} uninstalled.`);
        }
        render();
      });

      if (globalThis.Tweak) {
        const tweak = new Tweak({ title: 'Hub preview' });
        tweak.addSelect('density', { label: 'Density', options: ['Comfortable', 'Compact'], defaultValue: 'Comfortable' });
        tweak.onChange(({ density }) => root.classList.toggle('is-compact', density === 'Compact'));
      }

      render();
    })();
  </script>
</div>
