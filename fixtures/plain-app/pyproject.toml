[project]
name = "vibepy-plain"
version = "0.0.0"
description = "The smallest installable App. A fixture the Hub's tests install."
requires-python = ">=3.12"
dependencies = ["vibepy-core"]

[project.entry-points."vibepy.apps"]
plain-app = "plain_app.entry:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plain_app"]

[tool.uv.sources]
vibepy-core = { workspace = true }
