[project]
name = "vibepy-notes"
version = "0.1.0"
description = "An App with Tools and no Pages. The lightest thing a test installs"
requires-python = ">=3.12"
dependencies = ["vibepy-core[agent]"]

[project.entry-points."vibepy.apps"]
notes = "notes_app.entry:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_app"]

[tool.uv.sources]
vibepy-core = { workspace = true }
