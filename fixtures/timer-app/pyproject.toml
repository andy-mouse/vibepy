[project]
name = "vibepy-timer"
version = "0.0.0"
description = "A second App with a Web channel, for what needs two of them."
requires-python = ">=3.12"
dependencies = [
    "vibepy-core[web]",
    "nicegui>=3.16",
]

[project.entry-points."vibepy.apps"]
timer-app = "timer_app.entry:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timer_app"]

[tool.uv.sources]
vibepy-core = { workspace = true }
