[project]
name = "vibepy-expense"
version = "0.1.0"
description = "The Expense App docs/roadmap.md names: actor and role, without Pages"
requires-python = ">=3.12"
dependencies = ["vibepy-core[agent]"]

[project.entry-points."vibepy.apps"]
expense-app = "expense_app.entry:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_app"]

[tool.uv.sources]
vibepy-core = { workspace = true }
