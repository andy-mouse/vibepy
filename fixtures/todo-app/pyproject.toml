[project]
name = "vibepy-todo"
version = "0.1.0"
description = "The Todo App docs/roadmap.md names, and what the suite installs"
requires-python = ">=3.12"
dependencies = [
    "vibepy-core[web,agent]",
    "nicegui>=3.16",
]

[project.entry-points."vibepy.apps"]
todo-app = "todo_app.entry:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_app"]

[tool.uv.sources]
vibepy-core = { workspace = true }
