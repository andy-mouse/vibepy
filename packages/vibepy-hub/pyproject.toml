[project]
name = "vibepy-hub"
version = "0.1.0"
description = "Control plane for installed Vibepy Apps, with a board over it"
requires-python = ">=3.12"
dependencies = [
    "vibepy-core[web]",
    "pydantic>=2.9",
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.entry-points."vibepy.apps"]
hub = "vibepy_hub.entry:APP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibepy_hub"]

[tool.uv.sources]
vibepy-core = { workspace = true }
