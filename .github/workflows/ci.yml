name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync

      # The Windows runner image carries no GNU make; macOS does.
      - if: runner.os == 'Windows'
        run: choco install make --no-progress

      # `make test` serves an App through a real proxy, which `uv sync` does not
      # bring. Without this the proxy tests fail here and pass on a laptop, so
      # `make test` would not mean the same thing in the two places.
      - run: make tools

      - run: make lint typecheck test
